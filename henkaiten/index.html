<html lang="ja">

  <head>
    <title>辺回転3</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

  </head>
    

  <body style="background-color:#ffffff">
    
    <script src="../myslider.js"></script>

    <div style="display:flex;align-items:center;flex-wrap:wrap;max-width:500;margin-bottom:5px;">

      <a href="../index.html" style="margin-right:30px;">HOME</a>

      <h3 style="margin-right:30px; margin-top:0px;margin-bottom:0px;">多面体の辺回転</h3>

      <details id="mydetail" style="overflow-wrap:break-word;">  <!--折り畳み　openを付けると最初から開いた状態になる-->
        <summary id="summary_label">説明を開く</summary>
        <p>
          多面体の全ての辺を中点で固定して一斉に回転させます。
          <br>
          スライダーで辺の回転量・太さ・長さを調整できます。
        </p>

      </details>

    </div>


    <div style="display:flex;align-items:center;flex-wrap:wrap;margin-bottom:10px;">

      <h4 style="margin:5px;font-size:min(16px,4vw);" hidden>基本となる多面体　</h4>

      <select id="select1" style="font-size:min(16px,4vw);">
        <option value="option1">立方体から正8面体</option>
        <option value="option2">正20面体から正12面体</option>
      </select>


  
      <!-- <h4 style="margin-left:20px;font-size:min(16px,4vw);" class="hideElement">配色</h4> -->

      <select id="select2" style="margin-left:20px;font-size:min(16px,4vw);" class="hideElement">
        <option value="1col">1色</option>
        <option value="5col">5色</option>
        <option value="6cola">6色A</option>
        <option value="6colb">6色B</option>
        <option value="10cola">10色A</option>
        <option value="10colb">10色B</option>
      </select>

    </div>


    <canvas id="canvas1" style="margin-left:-8px;"></canvas> <!--id名は"canvas1"にする-->
    <script>
      let canvas1 = document.getElementById('canvas1');
      let size = Math.min(600, window.innerWidth-0);
      canvas1.width = size * window.devicePixelRatio;
      canvas1.height = size * window.devicePixelRatio * 0.8;
      canvas1.style.width = size;
      canvas1.style.height = size * 0.8;
    </script>

    <div style="height:10px"></div>

    <div style="display:flex;align-items:center" id="box1">
      <p id="label1" style="width:90px;margin-bottom:0px;margin-top:0px;" hidden>回転　0度</p>

      <img src="ico2.png" width="50" id="img1">
      <script>
        const slidera = new Slider1d({width:Math.min(500, window.innerWidth-120),bar_width:Math.min(500*0.85, (window.innerWidth-100)*0.85),height:46,bar_height:12,thumb_radius:16,background_color:"#ffffff",value:0,parent:"box1", dx:0})
      </script>
      <img src="dod2.png" width="50" id="img2">
    </div>

    <div style="display:flex;align-items:center" id="box2">

      <img src="thin2.png" width="50">
      <p style="width:90px;margin-bottom:0px;margin-top:0px;" hidden>太さ</p>

      <script>
        const sliderb = new Slider1d({width:Math.min(500, window.innerWidth-120),bar_width:Math.min(500*0.85, (window.innerWidth-100)*0.85),height:46,bar_height:12,thumb_radius:16,background_color:"#ffffff",value:0.16,parent:"box2", dx:0})
      </script>

      <img src="thick2.png" width="50">

    </div>

    <div style="display:flex;align-items:center" id="box3">
      <img src="short3.png" width="50">
      <p style="width:90px;margin-bottom:0px;margin-top:0px;" hidden>長さ</p>
      <script>
        const sliderc = new Slider1d({width:Math.min(500, window.innerWidth-120),bar_width:Math.min(500*0.85, (window.innerWidth-100)*0.85),height:46,bar_height:12,thumb_radius:16,background_color:"#ffffff",value:0.18,parent:"box3", dx:0})
      </script>
      <img src="long3.png" width="50">
    </div>


    <div style="height:5px"></div>


    <div style="display:flex;align-items:center;flex-wrap:wrap;" id="kakushi2">
  
      <h4 style="margin:5px;font-size:min(16px,4vw);" class="hideElement">途中に現れる顕著な図形　</h4>

      <select id="select3" style="font-size:min(16px,4vw);" class="hideElement">
        <option value="ico">正二十面体</option>
        <option value="triangle">正三角形10個絡み</option>
        <option value="5parallel">5本平行棒6筋</option>
        <option value="tetra">正四面体5個</option>
        <option value="pentagon">正五角形6つ絡み</option>
        <option value="star">星型6つ絡み</option>
        <option value="3parallel">3本平行棒10筋</option>
        <option value="dodeca">正十二面体</option>
        <option value="null"></option>
      </select>

    </div>


  


    <!--three.jsライブラリ-->
    <script src="https://unpkg.com/three@0.131.3/build/three.min.js"></script>

    <!--共通プログラム-->
    <script src="common_script1.js"></script>
    <script src="../common_script2.js"></script>
    <!--メインのプログラム-->
    <script src='script1.js'></script>


  </body>

</html>
